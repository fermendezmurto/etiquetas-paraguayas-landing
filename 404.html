<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso restringido · Etiquetas Paraguayas</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center;background:#04101f;color:#7fa9d8;font:400 1rem/1.6 ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <p>Acceso restringido. <a id="volver" href="/etiquetas-paraguayas-landing/" style="color:#a6ce39">Ingresar el código</a></p>
<script>
// Se olvida la ruta guardada antes de volver al ingreso: si la carpeta del
// demo cambió, sin esto el ingreso reenviaría acá y quedaría en bucle.
(function () {
  try { localStorage.removeItem('ep-demo-ruta'); } catch (e) {}
  var destino = document.getElementById('volver').getAttribute('href');
  if (location.pathname !== destino) { location.replace(destino); }
})();
</script>
</body>
</html>
