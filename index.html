<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Acceso restringido · Etiquetas Paraguayas</title>
<style>
  :root {
    --navy-950: #04101f;
    --navy-900: #071829;
    --navy-800: #0b2340;
    --navy-300: #7fa9d8;
    --verde: #a6ce39;
    --papel: #f4f6f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--navy-950);
    color: var(--papel);
    font: 400 1rem/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .caja {
    width: min(26rem, 100%);
    background: var(--navy-900);
    border: 1px solid var(--navy-800);
    border-radius: 0.9rem;
    padding: 2.25rem 2rem 2rem;
  }
  .barra { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-bottom: 1.75rem; }
  .barra i { flex: 1; }
  .marca {
    font: 600 0.72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--verde);
    margin: 0 0 0.85rem;
  }
  h1 { font-size: 1.4rem; line-height: 1.25; margin: 0 0 0.6rem; font-weight: 600; }
  p.sub { margin: 0 0 1.6rem; color: var(--navy-300); font-size: 0.92rem; }
  label {
    display: block;
    font: 600 0.7rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--navy-300);
    margin-bottom: 0.5rem;
  }
  input {
    width: 100%;
    padding: 0.8rem 0.9rem;
    font: 400 1.15rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.3em;
    color: var(--papel);
    background: var(--navy-950);
    border: 1px solid var(--navy-800);
    border-radius: 0.5rem;
  }
  input:focus { outline: 2px solid var(--verde); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 0.9rem;
    padding: 0.85rem 1rem;
    font: 600 0.95rem/1 inherit;
    color: #fff;
    background: var(--verde);
    border: 0;
    border-radius: 0.5rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  .error {
    margin: 0.9rem 0 0;
    font-size: 0.86rem;
    color: #ff9a9a;
    min-height: 1.3em;
  }
  footer {
    margin-top: 1.75rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--navy-800);
    font-size: 0.8rem;
    color: var(--navy-300);
  }
  footer a { color: var(--verde); text-decoration: none; }
</style>
</head>
<body>
  <main class="caja">
    <div class="barra">
      <i style="background:#3d9bc4"></i><i style="background:#c93f77"></i>
      <i style="background:#e0b13a"></i><i style="background:#e8edf2"></i>
      <i style="background:#a6ce39"></i>
    </div>

    <p class="marca">PuntoDev</p>
    <h1>Demo privado de Etiquetas Paraguayas</h1>
    <p class="sub">Esta vista previa está reservada. Ingresá el código de acceso para entrar.</p>

    <form id="f" autocomplete="off">
      <label for="pin">Código de acceso</label>
      <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="16" required autofocus aria-describedby="msg">
      <button type="submit">Entrar</button>
      <p class="error" id="msg" role="status"></p>
    </form>

    <footer>
      ¿No tenés el código? Escribí a <a href="mailto:fer@puntodev.com.py">fer@puntodev.com.py</a>
    </footer>
  </main>

<script>
(function () {
  var form = document.getElementById('f');
  var campo = document.getElementById('pin');
  var msg = document.getElementById('msg');
  var RECUERDO = 'ep-demo-ruta';

  // La carpeta del demo es el hash del código. El código no está en esta
  // página, así que mirar el fuente no dice a dónde lleva.
  function rutaDe(codigo) {
    var datos = new TextEncoder().encode(codigo);
    return crypto.subtle.digest('SHA-256', datos).then(function (buf) {
      var hex = Array.prototype.map
        .call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); })
        .join('');
      return 'd/' + hex.slice(0, 16) + '/';
    });
  }

  function entrar(ruta) {
    // Se comprueba que exista antes de navegar, para poder avisar del error
    // sin mandar al visitante a una pantalla de 404.
    return fetch(ruta, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) throw new Error('no existe');
      try { localStorage.setItem(RECUERDO, ruta); } catch (e) {}
      location.replace(ruta);
    });
  }

  // Si ya entró antes en este navegador, no se le vuelve a pedir.
  try {
    var guardada = localStorage.getItem(RECUERDO);
    if (guardada) { location.replace(guardada); }
  } catch (e) {}

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var codigo = campo.value.trim();
    if (!codigo) return;
    msg.textContent = '';
    rutaDe(codigo)
      .then(entrar)
      .catch(function () {
        msg.textContent = 'Código incorrecto.';
        campo.select();
      });
  });
})();
</script>
</body>
</html>
